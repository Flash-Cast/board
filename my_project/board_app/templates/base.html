{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}生体の住民{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'board_app:thread_list' %}">スレッド一覧</a></li>
                <li><a href="{% url 'board_app:create_thread' %}">スレッド作成</a></li>
                <li><a href="{% url 'board_app:about' %}">サイトについて</a></li>
                {% if user.is_authenticated %}
                    <!-- ログインしているユーザーにプロフィールリンクを表示 -->
                    <li><a href="{% url 'board_app:profile' %}">プロフィール</a></li>
                {% endif %}
                <!-- ログアウトフォーム -->
                <li>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">ログアウト</button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 tsukui</p>
    </footer>
</body>
</html>
