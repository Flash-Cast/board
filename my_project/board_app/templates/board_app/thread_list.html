{% extends 'base.html' %}

{% block title %}スレッド一覧{% endblock %}

{% block content %}
    <h1>スレッド一覧</h1>
    <a href="{% url 'board_app:create_thread' %}">新しいスレッドを作成</a>
    <ul>
        {% for thread in threads %}
            <li><a href="{% url 'board_app:thread_detail' thread.id %}">{{ thread.title }}</a> - 作成日: {{ thread.created_at }}</li>
        {% empty %}
            <li>スレッドはありません。</li>
        {% endfor %}
    </ul>
{% endblock %}
