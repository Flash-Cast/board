{% extends 'base.html' %}

{% block content %}
    <h1>プロフィール編集</h1>

    <form method="POST">
        {% csrf_token %}
        <p>
            <label for="id_username">ユーザー名:</label>
            {{ form.username }}
        </p>

        <p>
            <label for="id_email">メールアドレス:</label>
            {{ form.email }}
        </p>

        <button type="submit">更新</button>
    </form>

    <a href="{% url 'board_app:profile' %}">プロフィールページに戻る</a>
{% endblock %}
