{% extends "base.html" %}

{% block title %}サイトについて{% endblock %}

{% block content %}
    <h1>このサイトについて</h1>
    <p>このサイトは、ユーザーがスレッドを作成し、コメントを投稿できる掲示板アプリです。</p>

    <h2>主な機能</h2>
    <ul>
        <li>スレッドの作成</li>
        <li>投稿の追加</li>
        <li>ログイン・ログアウト機能</li>
    </ul>

    <h2>使い方</h2>
    <p>まずは新規登録を行い、ログインしてください。スレッド一覧から興味のあるスレッドを選ぶか、新しいスレッドを作成できます。</p>


{% endblock %}
